{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-10">
        <div class="card-custom">
            <div class="card-custom-header header-navy text-center">
                <span style="width: 100%; text-align: center;">🔑 시스템 로그인</span>
            </div>
            <div class="card-custom-body p-4">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">아이디</label>
                        <input type="text" id="loginUsername" class="form-control form-control-sm" value="admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">비밀번호</label>
                        <input type="password" id="loginPassword" class="form-control form-control-sm" value="admin1234" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold py-2">로그인</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: document.getElementById("loginUsername").value,
            password: document.getElementById("loginPassword").value
        })
    });
    const data = await res.json();
    if (res.ok) location.href = "/";
    else alert(data.message);
});
</script>
{% endblock %}
