{% extends "base.html" %}
{% block title %}로그인 | Shipyard Physical AI{% endblock %}
{% block content %}
<section class="login-shell">
    <article class="panel-card login-card">
        <div class="login-heading"><div class="brand-mark large">SH</div><div class="eyebrow">AUTHORIZED ACCESS</div><h2>플랫폼 로그인</h2><p>등록된 사용자 계정으로 접속하세요.</p></div>
        <form id="loginForm" class="panel-card-body">
            <div class="mb-3"><label for="loginUsername" class="form-label">아이디</label><input id="loginUsername" name="username" class="form-control" autocomplete="username" required></div>
            <div class="mb-4"><label for="loginPassword" class="form-label">비밀번호</label><input id="loginPassword" name="password" class="form-control" type="password" autocomplete="current-password" required></div>
            <button id="loginSubmit" class="btn btn-primary w-100" type="submit">로그인</button>
            <div id="loginError" class="form-error mt-3" role="alert"></div>
            <p class="form-hint mt-3 mb-0">신규 로컬 테스트 DB 기본 계정: <code>admin / admin1234</code>. 기존 DB는 기존 계정 비밀번호를 유지합니다.</p>
        </form>
    </article>
</section>
{% endblock %}
