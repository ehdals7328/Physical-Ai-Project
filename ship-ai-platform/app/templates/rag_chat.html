{% extends "base.html" %}
{% block content %}
<div class="row g-3">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-dark fw-bold">🔍 순수 LLM (ChromaDB RAG) 기술 기준 질의</div>
            <div class="card-body">
                <form id="ragForm">
                    <div class="mb-2">
                        <label class="form-label small fw-bold">문서 카테고리 필터 (7대 분류)</label>
                        <select id="ragCategory" class="form-select form-select-sm">
                            <option value="">전체 카테고리 검색</option>
                            <option value="제조기술">제조기술 (WPS)</option>
                            <option value="안전보건">안전보건 (KOSHA)</option>
                            <option value="선급법규">선급법규 (한국선급 KR)</option>
                            <option value="장비중량물">장비중량물</option>
                            <option value="품질검사">품질검사 (UT/RT)</option>
                            <option value="작업환경기상">작업환경기상</option>
                            <option value="사내문서">사내문서</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">질의 내용 (USER_QUERY -> AGENT_EXECUTIONS 기록)</label>
                        <textarea id="ragQuery" class="form-control" rows="3" required>AH36 16mm 맞대기 용접 시 적정 전류, 전압 조건과 밀폐공간 산소농도 기준은?</textarea>
                    </div>
                    <button type="submit" id="ragBtn" class="btn btn-primary w-100 fw-bold">💬 RAG 지식 검색 및 LLM 답변 생성</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-7">
        <div class="card shadow-sm mb-3">
            <div class="card-header bg-dark text-white fw-bold">🤖 AI Agent 응답 (AGENT_EXECUTIONS.RESPONSE_TEXT)</div>
            <div class="card-body" id="ragAnswerBox" style="white-space: pre-line;">질문을 입력하고 검색을 실행하세요.</div>
        </div>
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white fw-bold">📚 참조된 ChromaDB 원본 문서 청크 (DOCUMENT_METADATA 매핑)</div>
            <div class="card-body" id="ragRefBox">참조 문서가 여기에 표시됩니다.</div>
        </div>
    </div>
</div>

<script>
$("#ragForm").on("submit", async function(e) {
    e.preventDefault();
    $("#ragBtn").prop("disabled", true).text("RAG 벡터 검색 및 LLM 추론 중...");
    try {
        const res = await fetch("/api/rag/ask", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                query: $("#ragQuery").val(),
                category: $("#ragCategory").val()
            })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.message); return; }

        $("#ragAnswerBox").html(`<div class="fw-bold text-primary mb-2">[EXECUTION_ID: #${data.execution_id}]</div>${data.answer}`);
        let refHtml = "";
        data.references.forEach(r => {
            refHtml += `<div class="border rounded p-2 mb-2 bg-light small">
                <div class="d-flex justify-content-between">
                    <span class="badge bg-dark">${r.category}</span>
                    <span class="text-muted">DOC_ID: #${r.document_id} | 유사도: ${r.similarity_score}</span>
                </div>
                <div class="fw-bold mt-1">${r.document_name} (${r.source} / ${r.revision})</div>
                <div class="text-secondary mt-1">${r.chunk_text}</div>
            </div>`;
        });
        $("#ragRefBox").html(refHtml);
        refreshSystemStatus();
    } finally {
        $("#ragBtn").prop("disabled", false).text("💬 RAG 지식 검색 및 LLM 답변 생성");
    }
});
</script>
{% endblock %}
