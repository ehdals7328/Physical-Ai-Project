{% extends 'base.html' %}
{% block title %}로그인 | SHIP AI{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-lg-5">
        <div class="text-center mb-4"><div class="display-6 fw-bold">SHIP <span class="text-primary">AI</span></div><div class="text-secondary">조선소 용접 Physical AI 플랫폼</div></div>
        <form id="loginForm">
          <div class="mb-3"><label class="form-label">로그인 ID</label><input id="loginId" class="form-control" autocomplete="username" required></div>
          <div class="mb-4"><label class="form-label">비밀번호</label><input id="password" type="password" class="form-control" autocomplete="current-password" required></div>
          <button class="btn btn-primary w-100" type="submit">로그인</button>
          <div id="loginError" class="text-danger small mt-3" role="alert"></div>
        </form>
        <div class="alert alert-light border small mt-4 mb-0">초기 관리자 계정은 <code>scripts/seed_admin.py</code>로 생성합니다. 기본 비밀번호를 변경한 뒤 사용하세요.</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('loginError');err.textContent='';try{await apiFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login_id:document.getElementById('loginId').value,password:document.getElementById('password').value})});location.href='/';}catch(ex){err.textContent=ex.message;}});
</script>{% endblock %}
