<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조선소 Physical AI & Multi-DB/RAG 통합 관제 콘솔</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top-navbar">
    <a href="/" class="logo">🚢 HD / HWA Physical AI & Multi-DB Platform</a>
    <div style="display: flex; align-items: center; gap: 10px;">
        <span id="navUserBadge" class="badge-chip chip-dark">비로그인 (Guest)</span>
        <a href="/login" id="navLoginBtn" class="btn btn-outline-light btn-sm" style="font-size: 0.8rem; padding: 3px 10px;">로그인 / 계정</a>
        <button id="navLogoutBtn" class="btn btn-danger btn-sm d-none" style="font-size: 0.8rem; padding: 3px 10px;" onclick="doLogout()">로그아웃</button>
    </div>
</header>

<section class="status-strip">
    <div class="status-row">
        <span class="status-title text-primary">[DB 1: ship_user (공정/비전 9개 테이블)]</span>
        <span id="shipUserBar">로딩 중...</span>
        <button class="btn btn-outline-secondary btn-sm py-0 ms-auto" style="font-size: 0.78rem;" onclick="refreshStatus()">🔄 상태 새로고침</button>
    </div>
    <div class="status-row">
        <span class="status-title text-success">[DB 2: ship_erp (대기업 자원 7개 테이블)]</span>
        <span id="shipErpBar">로딩 중...</span>
    </div>
    <div class="status-row">
        <span class="status-title text-dark">[Multi-RAG (ChromaDB 2개 컬렉션)]</span>
        <span id="ragCountBar">로딩 중...</span>
    </div>
</section>

<main class="container-fluid px-4">
    {% block content %}{% endblock %}
</main>

<script>
function switchTab(targetTabId, btnElement) {
    document.querySelectorAll('.tab-view-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-menu-btn').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(targetTabId);
    if (target) target.classList.add('active');
    if (btnElement) btnElement.classList.add('active');
}

async function refreshStatus() {
    try {
        const res = await fetch("/api/system/status");
        if (!res.ok) return;
        const d = await res.json();
        const uBar = document.getElementById("shipUserBar");
        if (uBar && d.ship_user_counts) {
            uBar.innerHTML = Object.entries(d.ship_user_counts)
                .map(([k, v]) => `<span class="badge-chip chip-blue me-1">${k}: <b>${v}</b></span>`).join("");
        }
        const eBar = document.getElementById("shipErpBar");
        if (eBar && d.ship_erp_counts) {
            eBar.innerHTML = Object.entries(d.ship_erp_counts)
                .map(([k, v]) => `<span class="badge-chip chip-green me-1">${k}: <b>${v}</b></span>`).join("");
        }
        const rBar = document.getElementById("ragCountBar");
        if (rBar && d.rag_counts) {
            rBar.innerHTML = Object.entries(d.rag_counts)
                .map(([k, v]) => `<span class="badge-chip chip-dark me-1">${k}: <b style="color: #38bdf8;">${v} 청크</b></span>`).join("");
        }
    } catch(err) { console.error("상태 로드 에러:", err); }
}

async function checkSession() {
    try {
        const res = await fetch("/api/auth/session-check");
        const d = await res.json();
        const badge = document.getElementById("navUserBadge");
        const lBtn = document.getElementById("navLoginBtn");
        const loBtn = document.getElementById("navLogoutBtn");
        if (d.logged_in) {
            if (badge) { badge.className = "badge-chip chip-green"; badge.textContent = `👤 ${d.display_name} (${d.role})`; }
            if (lBtn) lBtn.classList.add("d-none");
            if (loBtn) loBtn.classList.remove("d-none");
        } else {
            if (badge) { badge.className = "badge-chip chip-dark"; badge.textContent = "비로그인 (기본: admin / admin1234)"; }
            if (lBtn) lBtn.classList.remove("d-none");
            if (loBtn) loBtn.classList.add("d-none");
        }
    } catch(e) {}
}

async function doLogout() {
    await fetch("/api/auth/logout", {method: "POST"});
    location.reload();
}

window.addEventListener('DOMContentLoaded', () => {
    checkSession();
    refreshStatus();
});
</script>
</body>
</html>
