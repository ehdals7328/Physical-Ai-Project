{% extends 'base.html' %}
{% block title %}작업지시 | SHIP AI{% endblock %}
{% block content %}
<div class="mb-4"><div class="eyebrow">PROCESS DATABASE</div><h1 class="h3 mb-1">용접 작업 요청</h1><p class="text-secondary mb-0">선박·블록·용접부를 구분해 작업 요청을 등록합니다. 실제 WPS 승인과 로봇 실행은 후속 기능으로 연결합니다.</p></div>
<div class="row g-3"><div class="col-xl-4"><div class="card"><div class="card-header bg-white fw-semibold">새 작업 등록</div><div class="card-body"><form id="workForm" class="row g-2">
<div class="col-6"><label class="form-label small">선박 코드 *</label><input class="form-control" name="ship_code" placeholder="SHIP-001" required></div><div class="col-6"><label class="form-label small">선박명</label><input class="form-control" name="ship_name" placeholder="컨테이너선 001"></div>
<div class="col-6"><label class="form-label small">블록 코드 *</label><input class="form-control" name="block_code" placeholder="B-402A" required></div><div class="col-6"><label class="form-label small">용접부 코드 *</label><input class="form-control" name="joint_code" placeholder="J-001" required></div>
<div class="col-12"><label class="form-label small">작업명 *</label><input class="form-control" name="work_title" placeholder="선미 블록 외판 맞대기 용접" required></div>
<div class="col-6"><label class="form-label small">용접 공정</label><select class="form-select" name="process_code"><option value="FCAW">FCAW</option><option value="GMAW">GMAW</option><option value="SAW">SAW</option><option value="GTAW">GTAW</option><option value="SMAW">SMAW</option></select></div><div class="col-6"><label class="form-label small">모재 재질</label><input class="form-control" name="base_material_grade" placeholder="AH36"></div>
<div class="col-6"><label class="form-label small">두께 (mm)</label><input class="form-control" type="number" step="0.001" min="0" name="plate_thickness_mm"></div><div class="col-6"><label class="form-label small">용접 자세</label><select class="form-select" name="weld_position_code"><option>1G</option><option>2G</option><option>3G</option><option>4G</option><option>5G</option><option>6G</option></select></div>
<div class="col-6"><label class="form-label small">사업장 코드 (ERP)</label><input class="form-control" name="erp_branch_code" placeholder="ULSAN-YARD-1"></div><div class="col-6"><label class="form-label small">도면 개정</label><input class="form-control" name="drawing_revision" value="A"></div>
<div class="col-6"><label class="form-label small">도면 번호</label><input class="form-control" name="drawing_no" placeholder="DWG-... "></div><div class="col-6"><label class="form-label small">용접 길이 (mm)</label><input class="form-control" type="number" min="0" step="0.001" name="design_length_mm"></div>
<div class="col-6"><label class="form-label small">WPS 코드 (선택)</label><input class="form-control" name="wps_code" placeholder="승인 WPS 코드"></div><div class="col-6"><label class="form-label small">WPS 개정 (선택)</label><input class="form-control" name="wps_revision" placeholder="예: Rev. A"></div>
<div class="col-12"><label class="form-label small">작업 설명</label><textarea class="form-control" name="work_description" rows="3"></textarea></div>
<div class="col-12"><button class="btn btn-primary w-100" type="submit" id="workSubmit">작업 요청 등록</button></div></form><div id="workFeedback" class="small mt-3"></div></div></div></div>
<div class="col-xl-8"><div class="card"><div class="card-header bg-white d-flex justify-content-between"><span class="fw-semibold">등록 작업 목록</span><button class="btn btn-sm btn-outline-secondary" id="reloadWorks">새로고침</button></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>작업 번호</th><th>작업명</th><th>선박 / 블록</th><th>공정</th><th>상태</th><th>요청일</th></tr></thead><tbody id="workRows"><tr><td colspan="6" class="text-center text-secondary py-4">불러오는 중...</td></tr></tbody></table></div></div></div></div>
{% endblock %}
{% block scripts %}<script>
async function loadWorks(){const tbody=document.getElementById('workRows');try{const d=await apiFetch('/api/work-orders');tbody.replaceChildren();if(!d.work_orders.length){tbody.innerHTML='<tr><td colspan="6" class="text-center text-secondary py-4">등록된 작업이 없습니다.</td></tr>';return;}d.work_orders.forEach(w=>{const tr=document.createElement('tr');[w.work_no,w.title,`${w.ship_code} / ${w.block_code}`,w.process_code||'-',w.status_code,w.requested_at].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v; if(i===0)td.className='font-monospace small';tr.appendChild(td);});tbody.appendChild(tr);});}catch(e){tbody.replaceChildren();const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.className='text-danger';td.textContent=e.message;tr.appendChild(td);tbody.appendChild(tr);}}
document.getElementById('workForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;const payload=Object.fromEntries(new FormData(form).entries());const btn=document.getElementById('workSubmit');btn.disabled=true;try{const d=await apiFetch('/api/work-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});document.getElementById('workFeedback').textContent=`등록 완료: ${d.work_no}`;document.getElementById('workFeedback').className='small mt-3 text-success';form.reset();loadWorks();}catch(err){document.getElementById('workFeedback').textContent=err.message;document.getElementById('workFeedback').className='small mt-3 text-danger';}finally{btn.disabled=false;}});
document.getElementById('reloadWorks').addEventListener('click',loadWorks);loadWorks();
</script>{% endblock %}
