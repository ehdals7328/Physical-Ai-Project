{% extends "layout/base.html" %}
{% block title %}통합 업무 | K-SmartShip{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">통합 업무</h1>
  </div>
  <button type="button" class="btn btn-outline-secondary btn-sm fw-semibold px-3" id="btn-ws-sync">새로고침</button>
</div>

<!-- 상단 통합 명령 입력창 + 5개 업무 탭 + 실행 중인 명령 배지 -->
<div class="panel-card">
  <form id="workspace-query-form" class="row g-2 align-items-end mb-3">
    <div class="col-12 col-md">
      <textarea id="ws-input" rows="1" class="form-control cmd-textarea"
                placeholder="{{ sample_placeholder }}">{{ initial_prompt }}</textarea>
    </div>
    <div class="col-12 col-md-auto">
      <button type="submit" id="ws-send-btn" class="btn btn-primary fw-semibold px-4 w-100"
              style="height:44px;background:#0052cc;border-color:#0052cc;">요청 전송</button>
    </div>
  </form>

  <div class="d-flex align-items-center flex-wrap gap-2">
    <div class="d-flex flex-wrap gap-1" id="ws-mode-chips">
      <button type="button" class="btn btn-sm btn-primary fw-semibold px-3" data-mode="init">종합 현황</button>
      <button type="button" class="btn btn-sm btn-outline-secondary fw-semibold px-3" data-mode="qa">업무 질문 · 기준서</button>
      {% if can_erp %}
      <button type="button" class="btn btn-sm btn-outline-secondary fw-semibold px-3" data-mode="erp">자재 · 인력 · 장비</button>
      <button type="button" class="btn btn-sm btn-outline-secondary fw-semibold px-3" data-mode="draft">발주 · 안내 메일</button>
      {% endif %}
      <button type="button" class="btn btn-sm btn-outline-secondary fw-semibold px-3" data-mode="vision">현장 확인 · 작업 지시</button>
    </div>

    <!-- 입력한 명령이 업무 탭 바로 옆에 표시 -->
    <div id="ws-active-cmd" class="active-cmd-pill" style="display:none;">
      <span class="fw-bold">실행 요청</span>
      <span class="cmd-text" id="ws-active-cmd-text"></span>
      <button type="button" class="btn-close" style="font-size:9px;" id="btn-clear-cmd"></button>
    </div>
  </div>
</div>

<!-- 동적 업무 영역 -->
<div id="workspace-stage"></div>

<!-- PDF 문서 바로 보기 모달 -->
<div class="modal fade" id="wsPdfModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-3">
        <h6 class="modal-title fw-bold" id="ws-pdf-title">문서 보기</h6>
        <div class="d-flex gap-2 align-items-center">
          <a id="ws-pdf-newtab" href="#" target="_blank" class="btn btn-outline-primary btn-sm">새 탭에서 열기</a>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
      </div>
      <div class="modal-body p-0" id="ws-pdf-body" style="min-height:520px;background:#f8fafc;"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  var CAN_ERP = {{ 'true' if can_erp else 'false' }};
  var CAN_INTERNAL_RAG = {{ 'true' if can_internal_rag else 'false' }};
  var CAN_ISSUE_WO = {{ 'true' if can_issue_wo else 'false' }};
  var BRANCH_LIST = [
    {% for b in branches %}
    { code: {{ b.branch_code | tojson }}, name: {{ b.branch_name | tojson }} }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  var esc = window.KSmartMd.esc;
  var renderMd = window.KSmartMd.render;

  var TASK_LABEL_MAP = {
    knowledge_qa: '기술 기준 안내',
    hr_worker_qa: '작업자 자격 조회',
    hr_safety_qa: '자격 유효성 확인',
    erp_resource_qa: '자재 · 장비 확인',
    scm_partner_qa: '협력사 자원 확인',
    vision_inspection_qa: '현장 상태 확인',
    doc_generation: '작업지시서 준비',
    chat: '일반 안내'
  };

  var STATUS_LABEL_MAP = {
    READY: '착수 대기',
    IN_PROGRESS: '진행 중',
    COMPLETED: '완료',
    SUSPENDED: '일시 중단',
    PENDING: '대기 중',
    DRAFT: '승인 대기',
    APPROVED: '승인 완료',
    STANDBY: '대기',
    IN_USE: '작업 중',
    MAINTENANCE: '점검 중'
  };

  var currentMode = 'init';
  var currentErpBranch = 'ALL';
  var currentErpSubtab = 'materials';
  var erpSearchQuery = '';
  var lastQaResult = null;
  var pendingDraftPrefill = null;
  var wsPollTimer = null;

  var summaryCache = null;
  var erpDataCache = null;
  var dynamicActions = {};
  var actionSeq = 0;

  function koStatus(code) {
    return STATUS_LABEL_MAP[code] || code || '-';
  }

  function registerAction(fn) {
    actionSeq += 1;
    var id = 'act_' + actionSeq;
    dynamicActions[id] = fn;
    return id;
  }

  function resetDynamicActions() {
    dynamicActions = {};
    actionSeq = 0;
  }

  $(document).on('click', '[data-act-id]', function () {
    var id = $(this).attr('data-act-id');
    if (dynamicActions[id]) dynamicActions[id](this);
  });

  function setStageLoading() {
    var $st = $('#workspace-stage');
    if ($.trim($st.html())) {
      $st.addClass('is-loading');
    } else {
      $st.html('<div class="panel-card text-muted text-center py-5">화면을 불러오고 있습니다...</div>');
    }
  }

  function setStageHtml(html) {
    var $st = $('#workspace-stage');
    $st.removeClass('is-loading').html('<div class="stage-fade-in">' + html + '</div>');
  }

  function setActiveChip(mode) {
    currentMode = mode;
    $('#ws-mode-chips button').removeClass('btn-primary').addClass('btn-outline-secondary');
    $('#ws-mode-chips button[data-mode="' + mode + '"]').removeClass('btn-outline-secondary').addClass('btn-primary');
  }

  function showActiveCmd(text) {
    $('#ws-active-cmd-text').text(text).attr('title', text);
    $('#ws-active-cmd').css('display', 'inline-flex');
  }

  function clearActiveCmd() {
    $('#ws-active-cmd').hide();
    $('#ws-active-cmd-text').text('');
  }

  function autoResizeTextarea(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(120, Math.max(44, el.scrollHeight)) + 'px';
  }

  function extractMailDraftFromAnswer(text) {
    if (!text) return null;
    var subjMatch = text.match(/제목\s*:\s*(.+)/);
    var recMatch = text.match(/수신\s*:\s*(.+)/);
    if (!subjMatch && !recMatch) return null;
    var bodyIdx = text.search(/본문\s*:/);
    var bodyText = bodyIdx >= 0 ? text.slice(bodyIdx).replace(/^본문\s*:\s*/, '').trim() : text;
    return {
      type: 'EMAIL',
      recipient: recMatch ? recMatch[1].trim() : '대상 작업자',
      subject: subjMatch ? subjMatch[1].trim() : '[안내] 업무 요청 알림',
      body: bodyText
    };
  }

  function openDraftWithPrefill(type, recipient, subject, body) {
    pendingDraftPrefill = { type: type, recipient: recipient, subject: subject, body: body };
    renderDraftCenterView();
  }

  function buildContextSummary() {
    if (!summaryCache) return '통합 업무 화면';
    var parts = [];
    if (summaryCache.low_materials && summaryCache.low_materials.length) {
      parts.push('부족자재=' + summaryCache.low_materials.map(function (m) {
        return m.item_code + '(' + m.item_name + ' ' + m.available_qty + m.unit + ')';
      }).join(', '));
    }
    if (summaryCache.active_queue && summaryCache.active_queue.length) {
      parts.push('진행블록=' + summaryCache.active_queue.slice(0, 3).map(function (q) {
        return q.block_code + '(' + q.branch_code + ')';
      }).join(', '));
    }
    return parts.join(' | ') || '통합 업무 화면';
  }

  /* =========================================================================
     1. 종합 현황 (W-01a)
     ========================================================================= */
  function renderInitView() {
    setActiveChip('init');
    resetDynamicActions();
    setStageLoading();

    $.getJSON('/service/api/workspace/summary', function (res) {
      summaryCache = res;
      var k = res.kpi || {};
      var alertTotal = (k.low_materials_cnt || 0) + (k.expiring_workers_cnt || 0);

      var kpiAct1 = registerAction(function () { location.href = '/service/work-status'; });
      var kpiAct2 = registerAction(function () { renderVisionCheckView(); });
      var kpiAct3 = registerAction(function () { if (res.can_erp) renderErpView('ALL', 'materials'); });
      var kpiAct4 = registerAction(function () {
        if (res.can_erp) renderDraftCenterView();
        else location.href = '/service/work-status';
      });

      var kpiHtml =
        '<div class="row g-3 mb-4">' +
          '<div class="col-6 col-lg-3">' +
            '<div class="kpi-tile kpi-blue clickable" data-act-id="' + kpiAct1 + '">' +
              '<div class="kpi-label">진행 · 대기 작업</div>' +
              '<div class="kpi-value">' + esc(k.active_orders || 0) + '<span class="fs-6 fw-normal text-muted ms-1">건</span></div>' +
              '<div class="kpi-sub">완료 ' + esc(k.completed_orders || 0) + '건 · 운영 야드 ' + esc(k.yards_cnt || 0) + '곳</div>' +
            '</div>' +
          '</div>' +
          '<div class="col-6 col-lg-3">' +
            '<div class="kpi-tile kpi-ok clickable" data-act-id="' + kpiAct2 + '">' +
              '<div class="kpi-label">오늘 작업 예정 블록</div>' +
              '<div class="kpi-value">' + esc(k.active_queue_cnt || 0) + '<span class="fs-6 fw-normal text-muted ms-1">블록</span></div>' +
              '<div class="kpi-sub">대기 용접로봇 ' + esc(k.robots_cnt || 0) + '대</div>' +
            '</div>' +
          '</div>' +
          '<div class="col-6 col-lg-3">' +
            '<div class="kpi-tile ' + (alertTotal > 0 ? 'kpi-danger' : '') + ' clickable" data-act-id="' + kpiAct3 + '">' +
              '<div class="kpi-label">확인 필요 자원</div>' +
              '<div class="kpi-value">' + (res.can_erp ? esc(alertTotal) + '<span class="fs-6 fw-normal text-muted ms-1">건</span>' : '-') + '</div>' +
              '<div class="kpi-sub">' + (res.can_erp ? ('부족 자재 ' + esc(k.low_materials_cnt || 0) + '건 · 자격 만료 알림 ' + esc(k.expiring_workers_cnt || 0) + '명') : '담당자 권한 필요') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="col-6 col-lg-3">' +
            '<div class="kpi-tile ' + ((k.pending_approvals || 0) > 0 ? 'kpi-warn' : '') + ' clickable" data-act-id="' + kpiAct4 + '">' +
              '<div class="kpi-label">승인 대기 지시서</div>' +
              '<div class="kpi-value">' + esc(k.pending_approvals || 0) + '<span class="fs-6 fw-normal text-muted ms-1">건</span></div>' +
              '<div class="kpi-sub">담당자 검토 후 확정</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      // 자주 쓰는 업무 — 제일 상단, 한 줄에 모두 보이도록 간결하게 배치
      var quickHtml = '';
      if (res.quick_prompts && res.quick_prompts.length) {
        var qBtns = res.quick_prompts.map(function (item) {
          var label = (typeof item === 'string') ? item : (item.label || item.prompt);
          var promptStr = (typeof item === 'string') ? item : (item.prompt || item.label);
          var actId = registerAction(function () { submitWorkspaceQuery(promptStr); });
          return '<button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3 text-nowrap" data-act-id="' + actId + '">' + esc(label) + '</button>';
        }).join('');
        quickHtml =
          '<div class="panel-card py-2 px-3 mb-3">' +
            '<div class="d-flex align-items-center gap-2 overflow-auto flex-nowrap py-1">' +
              '<span class="small fw-bold text-secondary text-nowrap me-1">자주 쓰는 업무</span>' + qBtns +
            '</div>' +
          '</div>';
      }

      // 오늘 작업 예정 블록
      var queueHtml = '';
      if (res.active_queue && res.active_queue.length) {
        queueHtml = res.active_queue.map(function (q) {
          var vAct = registerAction(function () { renderVisionCheckView(q.branch_code, q.block_code); });
          return (
            '<div class="queue-card mb-2">' +
              '<div class="d-flex justify-content-between align-items-start gap-2 mb-2">' +
                '<div>' +
                  '<span class="badge bg-dark me-1">순서 ' + esc(q.priority_rank) + '</span>' +
                  '<strong>' + esc(q.block_code) + '</strong>' +
                  '<span class="text-muted small ms-2">' + esc(q.material_grade || '') + (q.thickness_mm ? ' ' + esc(q.thickness_mm) + 'mm' : '') + ' · ' + esc(q.process_code) + '</span>' +
                  '<div class="text-secondary small mt-1">' + esc(q.branch_name) + (q.wo_no ? ' · ' + esc(q.wo_no) : '') + '</div>' +
                '</div>' +
                '<div class="text-end">' +
                  '<span class="status-chip ' + (q.state === 'IN_PROGRESS' ? 'status-info' : 'status-muted') + '">' + esc(koStatus(q.state)) + '</span>' +
                  '</div>' +
              '</div>' +
              '<div class="d-flex justify-content-end gap-2">' +
                '<button type="button" class="btn btn-outline-secondary btn-sm py-0" data-act-id="' + vAct + '">현장 · 중복 확인</button>' +
                (q.work_id ? '<a href="/service/work-status?work_id=' + esc(q.work_id) + '" class="btn btn-dark btn-sm py-0">작업 보기</a>' : '') +
              '</div>' +
            '</div>'
          );
        }).join('');
      } else {
        queueHtml = '<div class="text-muted small py-4 text-center">등록된 예정 공정이 없습니다. 자료실에서 선박 도면을 올려 공정을 시작해 주세요.</div>';
      }

      // 운영 야드 카드
      var yardHtml = '';
      if (res.yard_cards && res.yard_cards.length) {
        yardHtml = '<div class="row g-2">' + res.yard_cards.map(function (y) {
          var erpBtn = '';
          if (res.can_erp) {
            var yAct = registerAction(function () { renderErpView(y.branch_code, 'materials'); });
            erpBtn = '<button type="button" class="btn btn-outline-primary btn-sm py-0" data-act-id="' + yAct + '">자재 · 인력</button>';
          }
          return (
            '<div class="col-md-6">' +
              '<div class="yard-tile h-100">' +
                '<div class="d-flex justify-content-between align-items-start gap-2 mb-1">' +
                  '<strong class="small">' + esc(y.branch_name) + '</strong>' +
                  '<span class="status-chip status-info">' + esc(y.region_name) + '</span>' +
                '</div>' +
                '<div class="text-muted small mb-2">진행 선박: <strong class="text-dark">' + esc(y.primary_ship) + '</strong> · 블록 ' + esc(y.primary_block) + '</div>' +
                '<div class="d-flex flex-wrap gap-2 small text-secondary mb-2">' +
                  '<span>작업 <strong>' + esc(y.active_order_count) + '</strong>건</span>' +
                  '<span>장비 <strong>' + esc(y.equip_count) + '</strong>대</span>' +
                  (y.low_mat_count > 0 ? '<span class="text-danger">부족 자재 <strong>' + esc(y.low_mat_count) + '</strong>종</span>' : '') +
                '</div>' +
                '<div class="d-flex gap-2">' +
                  '<a href="/vision/?branch=' + encodeURIComponent(y.branch_code) + '" class="btn btn-dark btn-sm py-0">현장 카메라</a>' +
                  erpBtn +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('') + '</div>';
      } else {
        yardHtml = '<div class="text-muted small py-3 text-center">등록된 야드가 없습니다.</div>';
      }

      // 확인 필요 자원 (부족 자재 + 만료 임박 자격)
      var urgentHtml = '';
      if (!res.can_erp) {
        urgentHtml = '<div class="small text-muted py-3">자재·인력 조회 권한이 있는 담당자에게만 표시됩니다.</div>';
      } else {
        var mItems = (res.low_materials || []).map(function (m) {
          var actId = registerAction(function () {
            openDraftWithPrefill(
              'PO',
              '자재 공급사 담당자',
              '[긴급 발주] ' + m.item_name + ' (' + m.item_code + ')',
              m.branch_name + ' 공정용 ' + m.item_name + '(' + m.item_code + ') 가용 재고가 ' + m.available_qty + m.unit + '으로 부족하여 긴급 납품을 요청드립니다.'
            );
          });
          return (
            '<div class="d-flex justify-content-between align-items-center py-2 border-bottom gap-2 small">' +
              '<div>' +
                '<span class="status-chip status-danger me-1">자재 부족</span>' +
                '<strong>' + esc(m.item_name) + '</strong>' +
                '<div class="text-muted">' + esc(m.branch_name) + ' · 가용 ' + esc(m.available_qty) + esc(m.unit) + '</div>' +
              '</div>' +
              '<button type="button" class="btn btn-outline-primary btn-sm py-0 text-nowrap" data-act-id="' + actId + '">발주 메일</button>' +
            '</div>'
          );
        }).join('');

        var wItems = (res.expiring_workers || []).map(function (w) {
          var actId = registerAction(function () {
            openDraftWithPrefill(
              'EMAIL',
              w.worker_name + ' (' + w.worker_id + ')',
              '[필수] 용접 자격 갱신 안내 (' + w.cert_code + ')',
              '안녕하세요, ' + w.worker_name + '님.\n보유 중인 용접 자격(' + w.cert_code + ', ' + w.weld_process + ')의 만료일(' + w.cert_expiry_date + ')이 도래/경과하여 갱신 절차를 안내드립니다.'
            );
          });
          return (
            '<div class="d-flex justify-content-between align-items-center py-2 border-bottom gap-2 small">' +
              '<div>' +
                '<span class="status-chip ' + (w.level === 'EXPIRED' ? 'status-danger' : 'status-warn') + ' me-1">' + esc(w.dday_label) + '</span>' +
                '<strong>' + esc(w.worker_name) + '</strong> (' + esc(w.cert_code) + ')' +
                '<div class="text-muted">' + esc(w.branch_name) + ' · 만료일 ' + esc(w.cert_expiry_date) + '</div>' +
              '</div>' +
              '<button type="button" class="btn btn-outline-dark btn-sm py-0 text-nowrap" data-act-id="' + actId + '">갱신 메일</button>' +
            '</div>'
          );
        }).join('');

        urgentHtml = (mItems + wItems) || '<div class="small text-muted py-3 text-center">현재 부족한 자재나 만료 임박 자격이 없습니다.</div>';
      }

      // 최근 작업지시서
      var docsHtml = (res.recent_docs && res.recent_docs.length)
        ? res.recent_docs.map(function (d) {
            return (
              '<div class="d-flex justify-content-between align-items-center py-2 border-bottom small gap-2">' +
                '<div>' +
                  '<strong>' + esc(d.work_no) + '</strong> <span class="badge bg-light text-dark border ms-1">' + esc(d.revision_no) + '</span>' +
                  '<div class="text-muted">' + esc(d.ship_code) + ' / ' + esc(d.block_code) + ' · ' + esc(d.branch_name) + '</div>' +
                '</div>' +
                '<div class="text-end text-nowrap">' +
                  '<span class="status-chip ' + (d.approval_status === 'APPROVED' ? 'status-ok' : 'status-warn') + '">' + esc(koStatus(d.approval_status)) + '</span>' +
                  '<a href="/service/work-status?work_id=' + esc(d.work_id) + '" class="btn btn-outline-dark btn-sm py-0 ms-1">보기</a>' +
                '</div>' +
              '</div>'
            );
          }).join('')
        : '<div class="small text-muted py-3 text-center">생성된 작업지시서가 없습니다.</div>';

      var goDraftAct = registerAction(function () { renderDraftCenterView(); });

      setStageHtml(
        quickHtml +
        kpiHtml +
        '<div class="row g-3">' +
          '<div class="col-lg-7">' +
            '<div class="panel-card">' +
              '<div class="section-bar"><h2 class="panel-title">오늘 작업 예정 블록</h2><a href="/service/library/upload-cad" class="small fw-semibold text-decoration-none">+ 선박 도면 등록</a></div>' +
              queueHtml +
            '</div>' +
            '<div class="panel-card mb-0">' +
              '<div class="section-bar"><h2 class="panel-title">운영 중인 야드</h2><a href="/vision/" class="small fw-semibold text-decoration-none">현장 관제 이동 →</a></div>' +
              yardHtml +
            '</div>' +
          '</div>' +
          '<div class="col-lg-5">' +
            '<div class="panel-card">' +

  /* =========================================================================
     2. 업무 질문 · 기준서 (W-01b — 최근 질의 이력 완전 제거, 깔끔한 단일 집중 화면)
     ========================================================================= */
  function renderQaTabView(explicitResult) {
    setActiveChip('qa');

    if (explicitResult) lastQaResult = explicitResult;

    if (!lastQaResult) {
      $.getJSON('/service/api/workspace/qa-context', function (ctx) {
        function buildDocCards(list, badgeText) {
          if (!list || !list.length) return '<div class="col-12 text-muted small py-2">등록된 문서가 없습니다.</div>';
          return list.map(function (d) {
            var pAct = registerAction(function () { openWsPdfModal(d.document_id, d.document_title); });
            return (
              '<div class="col-md-6">' +
                '<div class="border rounded p-3 bg-light d-flex justify-content-between align-items-center gap-2 h-100">' +
                  '<div class="text-truncate"><strong class="small">' + esc(d.document_title) + '</strong><div class="text-muted" style="font-size:12px;">' + esc(badgeText) + '</div></div>' +
                  '<button type="button" class="btn btn-outline-primary btn-sm py-0 text-nowrap" data-act-id="' + pAct + '">PDF 보기</button>' +
                '</div>' +
              '</div>'
            );
          }).join('');
        }

        var sections =
          '<div class="mb-4">' +
            '<div class="small fw-bold text-primary mb-2">공통 기술문서</div>' +
            '<div class="row g-2">' + buildDocCards(ctx.public_docs, '공통 기술문서') + '</div>' +
          '</div>';

        if (ctx.can_internal) {
          sections +=
            '<div class="mb-4">' +
              '<div class="small fw-bold text-dark mb-2">사내 규정</div>' +
              '<div class="row g-2">' + buildDocCards(ctx.internal_docs, '사내 규정') + '</div>' +
            '</div>';
          if (ctx.cad_pdf_docs && ctx.cad_pdf_docs.length) {
            sections +=
              '<div>' +
                '<div class="small fw-bold text-secondary mb-2">선박 도면 (PDF)</div>' +
                '<div class="row g-2">' + buildDocCards(ctx.cad_pdf_docs, '선박 도면 PDF') + '</div>' +
              '</div>';
          }
        }

        setStageHtml(
          '<div class="panel-card">' +
            '<div class="section-bar"><h2 class="panel-title">업무 질문 · 용접 기준서 안내</h2><a href="/service/library" class="small fw-semibold text-decoration-none">자료실 전체 보기 →</a></div>' +
            '<p class="text-secondary small mb-4">상단 입력창에 용접 조건, 안전 수칙, 야드 자재·인력, 메일 작성, 오늘 업무를 자유롭게 입력해 주세요.</p>' +
            sections +
          '</div>'
        );
      });
      return;
    }

    var activeRes = lastQaResult;
    var label = TASK_LABEL_MAP[activeRes.task_type] || 'AI 분석 결과';
    var mailCandidate = CAN_ERP ? extractMailDraftFromAnswer(activeRes.answer) : null;
    var sources = activeRes.sources || [];

    var srcHtml = '';
    if (sources.length && activeRes.task_type !== 'chat') {
      srcHtml =
        '<div class="border-top mt-3 pt-3">' +
          '<div class="small fw-bold text-secondary mb-2">참고한 기술 기준서</div>' +
          '<div class="row g-2">' +
            sources.map(function (s) {
              var locked = (s.collection_type === 'INTERNAL' && !CAN_INTERNAL_RAG);
              return (
                '<div class="col-md-6">' +
                  '<div class="border rounded p-2 px-3 bg-light small d-flex justify-content-between align-items-center gap-2">' +
                    '<span><strong>[' + (s.collection_type === 'INTERNAL' ? '사내 규정' : '공통 기준') + ']</strong> ' + esc(s.title) + ' (p.' + esc(s.page) + ')</span>' +
                    (locked ? '<span class="text-muted">열람 권한 필요</span>' : '<a href="/service/library?q=' + encodeURIComponent(s.doc_code || s.title) + '" class="btn btn-outline-dark btn-sm py-0 text-nowrap">문서 보기</a>') +
                  '</div>' +
                '</div>'
              );
            }).join('') +
          '</div>' +
        '</div>';
    }

    var actionHtml = '';
    if (activeRes.generated_document && activeRes.generated_document.approval_status === 'DRAFT' && activeRes.session_id) {
      actionHtml += '<a href="/service/agent/plan/' + encodeURIComponent(activeRes.session_id) + '" class="btn btn-primary btn-sm px-3" style="background:#0052cc;border-color:#0052cc;">실행안 검토 및 승인 →</a>';
    }
    if (mailCandidate) {
      var mailAct = registerAction(function () {
        openDraftWithPrefill(mailCandidate.type, mailCandidate.recipient, mailCandidate.subject, mailCandidate.body);
      });
      actionHtml += '<button type="button" class="btn btn-outline-primary btn-sm px-3" data-act-id="' + mailAct + '">이 내용으로 메일 작성 →</button>';
    }

    setStageHtml(
      '<div class="panel-card">' +
        '<div class="section-bar">' +
          '<div class="d-flex align-items-center gap-2"><h2 class="panel-title">분석 결과</h2><span class="status-chip status-info">' + esc(label) + '</span></div>' +
          '<div class="d-flex flex-wrap gap-2">' + actionHtml + '</div>' +
        '</div>' +
        renderMd(activeRes.answer) +
        srcHtml +
      '</div>'
    );

  /* =========================================================================
     3. 자재 · 인력 · 장비 조회 (W-01c — 깔끔한 사내 자원 대시보드)
     ========================================================================= */
  function renderErpView(branchCode, subtab) {

    $.getJSON('/service/api/workspace/erp-yard', { branch_code: currentErpBranch }, function (res) {

      var branchOpts = '<option value="ALL"' + (currentErpBranch === 'ALL' ? ' selected' : '') + '>전체 야드</option>' +

            '</div>' +
            '<div class="btn-group btn-group-sm flex-wrap" id="erp-subtabs">' +
              '<button type="button" class="btn ' + (currentErpSubtab === 'materials' ? 'btn-dark' : 'btn-outline-dark') + '" data-erp-tab="materials">자재 재고 (' + esc(k.material_count || 0) + ')</button>' +
              '<button type="button" class="btn ' + (currentErpSubtab === 'workers' ? 'btn-dark' : 'btn-outline-dark') + '" data-erp-tab="workers">작업자 자격 (' + esc(k.worker_count || 0) + ')</button>' +
              '<button type="button" class="btn ' + (currentErpSubtab === 'equipment' ? 'btn-dark' : 'btn-outline-dark') + '" data-erp-tab="equipment">장비 · 로봇 (' + esc(k.equipment_count || 0) + ')</button>' +
              '<button type="button" class="btn ' + (currentErpSubtab === 'b2b' ? 'btn-dark' : 'btn-outline-dark') + '" data-erp-tab="b2b">협력사 가용 자원 (' + esc(k.b2b_count || 0) + ')</button>' +
            '</div>' +
          '</div>' +

      var kpiRow =

          '<div class="col-6 col-lg-3"><div class="kpi-tile kpi-blue clickable" data-erp-tab="materials"><div class="kpi-label">보유 자재</div><div class="kpi-value">' + esc(k.material_count || 0) + '<span class="fs-6 fw-normal text-muted ms-1">종</span></div><div class="kpi-sub ' + (k.low_material_count > 0 ? 'text-danger fw-semibold' : '') + '">부족 경고 ' + esc(k.low_material_count || 0) + '종</div></div></div>' +

          '<div class="col-6 col-lg-3"><div class="kpi-tile kpi-ok clickable" data-erp-tab="equipment"><div class="kpi-label">장비 · 차량 · 로봇</div><div class="kpi-value">' + esc(k.equipment_count || 0) + '<span class="fs-6 fw-normal text-muted ms-1">대</span></div><div class="kpi-sub">즉시 투입 대기 ' + esc(k.standby_equipment_count || 0) + '대</div></div></div>' +
          '<div class="col-6 col-lg-3"><div class="kpi-tile clickable" data-erp-tab="b2b"><div class="kpi-label">협력사 지원 가능</div><div class="kpi-value">' + esc(k.b2b_count || 0) + '<span class="fs-6 fw-normal text-muted ms-1">건</span></div><div class="kpi-sub">자재 · 인력 · 장비</div></div></div>' +

          '<tbody>' + rows + '</tbody></table></div>'
      );
    } else if (subtab === 'workers') {

      });

      var wRows = wList.map(function (w) {

          );
        });
        return (
          '<tr>' +
            '<td><strong>' + esc(w.worker_name) + '</strong><div class="small text-muted">' + esc(w.worker_id) + '</div></td>' +

            '<input type="text" id="erp-filter-input" class="form-control form-control-sm w-auto" style="min-width:190px;" value="' + esc(erpSearchQuery) + '" placeholder="이름 · 사번 · 자격 검색">' +

      $box.html(
        '<div class="section-bar"><h3 class="panel-title">배치 장비 · 차량 · 용접로봇 현황</h3></div>' +
        '<div class="table-responsive"><table class="table table-enterprise">' +
          '<thead><tr><th>장비 코드</th><th>장비명 / 소유사</th><th>위치</th><th>최대 하중</th><th>전담 담당자</th><th>상태</th></tr></thead>' +

  /* =========================================================================
     4. 발주 · 안내 메일 (W-01d — 독립된 초안 작성 및 검토 발송 화면)
     ========================================================================= */
  function fillDraftEditor(type, recipient, subject, body) {
    $('#draft-type').val(type || 'EMAIL');
    $('#draft-recipient').val(recipient || '');
    $('#draft-subject').val(subject || '');
    $('#draft-body').val(body || '');
  }

  function renderDraftCenterView() {
    if (!CAN_ERP) {
      setStageHtml('<div class="panel-card text-center py-5"><h5 class="fw-bold mb-2">발주 · 메일 발송 권한이 필요합니다</h5><p class="text-muted small mb-0">담당자에게 권한 부여를 요청해 주세요.</p></div>');
      return;
    }
    setActiveChip('draft');
    resetDynamicActions();
    setStageLoading();

    $.getJSON('/service/api/workspace/draft-center', function (res) {
      var bulkBtn = '';
      if (res.alert_workers && res.alert_workers.length) {
        var bAct = registerAction(function () {
          var list = res.alert_workers || [];
          var recipients = list.map(function (w) { return w.worker_name + '(' + w.worker_id + ')'; }).join(', ');
          var lines = list.map(function (w) {
            return '- ' + w.worker_name + ' (' + w.cert_code + ' / ' + w.weld_process + ', 만료일 ' + w.cert_expiry_date + ', ' + w.dday_label + ')';
          }).join('\n');
          fillDraftEditor(
            'EMAIL',
            recipients,
            '[일괄 안내] 용접 자격 만료 및 갱신 요청 (' + list.length + '명)',
            '안녕하세요. 운영지원팀입니다.\n아래 대상자분들의 용접 자격 만료일이 도래하거나 경과하여 일괄 갱신 안내를 드립니다.\n\n' + lines + '\n\n갱신 완료 후 자격증 사본을 담당 팀장에게 제출해 주시기 바랍니다.'
          );
        });
        bulkBtn = '<button type="button" class="btn btn-dark btn-sm py-0" data-act-id="' + bAct + '">전체 일괄 작성</button>';
      }

      var alertWorkersHtml = (res.alert_workers && res.alert_workers.length)
        ? res.alert_workers.map(function (w) {
            var act = registerAction(function () {
              fillDraftEditor(
                'EMAIL',
                w.worker_name + ' (' + w.worker_id + ')',
                '[필수] 용접 자격 갱신 안내 (' + w.cert_code + ')',
                '안녕하세요, ' + w.worker_name + '님.\n보유 중인 용접 자격(' + w.cert_code + ', ' + w.weld_process + ')의 만료일(' + w.cert_expiry_date + ')이 도래/경과하여 갱신 절차를 안내드립니다.'
              );
            });
            return (
              '<div class="d-flex justify-content-between align-items-center py-2 border-bottom small gap-2">' +
                '<div>' +
                  '<span class="status-chip ' + (w.level === 'EXPIRED' ? 'status-danger' : 'status-warn') + ' me-1">' + esc(w.dday_label) + '</span>' +
                  '<strong>' + esc(w.worker_name) + '</strong> (' + esc(w.cert_code) + ')' +
                  '<div class="text-muted">' + esc(w.company_name) + ' · ' + esc(w.branch_name) + '</div>' +
                '</div>' +
                '<button type="button" class="btn btn-outline-dark btn-sm py-0 text-nowrap" data-act-id="' + act + '">초안 채우기</button>' +
              '</div>'
            );
          }).join('')
        : '<div class="small text-muted py-2">만료 또는 임박한 자격 대상자가 없습니다.</div>';

      var lowMatHtml = (res.low_materials && res.low_materials.length)
        ? res.low_materials.map(function (m) {
            var act = registerAction(function () {
              fillDraftEditor(
                'PO',
                m.supplier_name + ' 영업담당자',
                '[긴급 발주] ' + m.item_name + ' (' + m.item_code + ')',
                m.branch_name + ' 현장 공정용 ' + m.item_name + '(' + m.item_code + ') 재고가 부족(가용 ' + m.available_qty + m.unit + ')하여 긴급 납품을 요청드립니다.'
              );
            });
            return (
              '<div class="d-flex justify-content-between align-items-center py-2 border-bottom small gap-2">' +
                '<div>' +
                  '<span class="status-chip status-danger me-1">부족</span>' +
                  '<strong>' + esc(m.item_name) + '</strong> (가용 ' + esc(m.available_qty) + esc(m.unit) + ')' +
                  '<div class="text-muted">' + esc(m.branch_name) + ' · ' + esc(m.supplier_name) + '</div>' +
                '</div>' +
                '<button type="button" class="btn btn-outline-primary btn-sm py-0 text-nowrap" data-act-id="' + act + '">발주 초안</button>' +
              '</div>'
            );
          }).join('')
        : '<div class="small text-muted py-2">발주가 필요한 부족 자재가 없습니다.</div>';

      var pendingHtml = (res.pending_docs && res.pending_docs.length)
        ? res.pending_docs.map(function (d) {
            var link = d.session_id
              ? '<a href="/service/agent/plan/' + encodeURIComponent(d.session_id) + '" class="btn btn-primary btn-sm py-0 text-nowrap">승인 검토</a>'
              : '<a href="/service/work-status?work_id=' + esc(d.work_id) + '" class="btn btn-outline-dark btn-sm py-0 text-nowrap">열람</a>';
            return (
              '<div class="d-flex justify-content-between align-items-center py-2 border-bottom small gap-2">' +
                '<div><strong>' + esc(d.work_no) + '</strong> <span class="status-chip status-warn ms-1">승인 대기</span><div class="text-muted">' + esc(d.ship_code) + ' / ' + esc(d.block_code) + '</div></div>' +
                link +
              '</div>'
            );
          }).join('')
        : '<div class="small text-muted py-2">승인 대기 중인 작업지시서가 없습니다.</div>';

      var histHtml = (res.sent_history && res.sent_history.length)
        ? res.sent_history.map(function (h) {
            return (
              '<div class="d-flex justify-content-between align-items-center py-2 border-bottom small gap-2">' +
                '<span class="text-truncate"><span class="badge bg-light text-dark border me-1">' + (h.draft_type === 'PO' ? '발주서' : '안내메일') + '</span><strong>' + esc(h.subject) + '</strong> (' + esc(h.recipient) + ')</span>' +
                '<span class="text-muted text-nowrap">' + esc(h.created_at) + '</span>' +
              '</div>'
            );
          }).join('')
        : '<div class="small text-muted py-2">최근 발송 이력이 없습니다.</div>';

      var clearAct = registerAction(function () { $('#draft-recipient, #draft-subject, #draft-body').val(''); });
      var sendAct = registerAction(function () {
        $.ajax({
          url: '/service/api/workspace/send-draft',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            draft_type: $('#draft-type').val(),
            recipient: $('#draft-recipient').val(),
            subject: $('#draft-subject').val(),
            body: $('#draft-body').val()
          }),
          success: function (r) { alert(r.message); renderDraftCenterView(); },
          error: function (xhr) { alert((xhr.responseJSON && xhr.responseJSON.message) || '발송 처리에 실패했습니다.'); }
        });
      });

      setStageHtml(
        '<div class="row g-3">' +
          '<div class="col-lg-5">' +
            '<div class="panel-card"><div class="section-bar"><h3 class="panel-title">자격 갱신 안내 대상</h3>' + bulkBtn + '</div>' + alertWorkersHtml + '</div>' +
            '<div class="panel-card"><div class="section-bar"><h3 class="panel-title">부족 자재 발주 대상</h3></div>' + lowMatHtml + '</div>' +
            '<div class="panel-card mb-0"><div class="section-bar"><h3 class="panel-title">승인 대기 작업지시서</h3></div>' + pendingHtml + '</div>' +
          '</div>' +
          '<div class="col-lg-7">' +
            '<div class="panel-card">' +
              '<div class="section-bar">' +
                '<h3 class="panel-title">메일 · 발주서 초안 작성 및 발송</h3>' +
                '<select id="draft-type" class="form-select form-select-sm w-auto"><option value="EMAIL">자격 갱신 / 안내 메일</option><option value="PO">협력사 자재 발주서</option></select>' +
              '</div>' +
              '<div class="mb-2"><label class="form-label small fw-semibold mb-1">수신자</label><input id="draft-recipient" class="form-control form-control-sm" placeholder="좌측 항목을 클릭하거나 수신자를 입력하세요"></div>' +
              '<div class="mb-2"><label class="form-label small fw-semibold mb-1">제목</label><input id="draft-subject" class="form-control form-control-sm"></div>' +
              '<div class="mb-3"><label class="form-label small fw-semibold mb-1">본문 (발송 전 자유롭게 수정 가능)</label><textarea id="draft-body" rows="8" class="form-control form-control-sm"></textarea></div>' +
              '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">' +
                '<span class="small text-muted">승인 후 발송 버튼을 누르기 전에는 발송되지 않습니다.</span>' +
                '<div class="d-flex gap-2">' +
                  '<button type="button" class="btn btn-outline-secondary btn-sm" data-act-id="' + clearAct + '">초기화</button>' +
                  '<button type="button" class="btn btn-primary btn-sm px-3 fw-semibold" style="background:#0052cc;border-color:#0052cc;" data-act-id="' + sendAct + '">승인 후 발송</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="panel-card mb-0"><div class="section-bar"><h3 class="panel-title">최근 발송 기록</h3></div>' + histHtml + '</div>' +
          '</div>' +
        '</div>'
      );

      if (pendingDraftPrefill) {
        fillDraftEditor(pendingDraftPrefill.type, pendingDraftPrefill.recipient, pendingDraftPrefill.subject, pendingDraftPrefill.body);
        pendingDraftPrefill = null;
      }
    });
  }

  /* =========================================================================
     5. 현장 확인 · 작업 지시 (W-01e)
     ========================================================================= */
  function renderVisionCheckView(branchCode, blockCode) {
    setActiveChip('vision');
    resetDynamicActions();
    setStageLoading();

    $.ajax({
      url: '/service/api/workspace/check-duplicate',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ branch_code: branchCode || '', block_code: blockCode || '' }),
      success: function (res) {
        if (!res.block) {
          setStageHtml('<div class="panel-card text-muted text-center py-5">등록된 블록 데이터가 없습니다.</div>');
          return;
        }
        var b = res.block;
        var v = res.vision;
        var wo = res.existing_wo;
        var opts = (res.block_options || []).map(function (o) {
          return '<option value="' + esc(o.block_id) + '" data-branch="' + esc(o.branch_code) + '"' + (o.block_id === b.block_id ? ' selected' : '') + '>' + esc(o.ship_code) + ' / ' + esc(o.block_id) + ' (' + esc(o.block_name) + ')</option>';
        }).join('');

        var dupHtml = '';
        if (res.exists) {
          dupHtml =
            '<div class="alert alert-warning small mb-3">오늘 이미 발급된 작업지시서가 있어 중복 생성을 막았습니다.</div>' +
            '<div class="border rounded p-3 bg-light mb-3 small">' +
              '<div class="mb-1"><strong>지시 번호:</strong> ' + esc(wo.work_no) + ' <span class="badge bg-dark ms-1">' + esc(wo.revision_no) + '</span></div>' +
              '<div class="mb-1"><strong>현재 상태:</strong> ' + esc(koStatus(wo.status_code)) + ' · 진척률 ' + esc(wo.progress_pct) + '%</div>' +
              '<div><strong>선박 중량물 계획:</strong> ' + (res.ship_plan_exists ? esc(b.ship_code) + ' 기존 계획 적용 중' : '신규 검토 필요') + '</div>' +
            '</div>' +
            '<div class="d-flex flex-wrap gap-2">' +
              '<a href="/service/work-status?work_id=' + esc(wo.work_id) + '" class="btn btn-outline-dark btn-sm">기존 지시서 보기</a>' +
              (CAN_ISSUE_WO ? '<a href="/service/agent/analyze?mode=REVISE&branch_code=' + encodeURIComponent(res.branch.branch_code) + '&block_code=' + encodeURIComponent(b.block_id) + '&work_id=' + esc(wo.work_id) + '" class="btn btn-primary btn-sm" style="background:#0052cc;border-color:#0052cc;">조건 변경 · 개정 요청</a>' : '') +
            '</div>';
        } else {
          dupHtml =
            '<div class="alert alert-success small mb-3">중복된 작업지시서가 없습니다. 새 작업지시를 준비할 수 있습니다.</div>' +
            '<div class="border rounded p-3 bg-light mb-3 small"><strong>선박 중량물 계획:</strong> ' + (res.ship_plan_exists ? esc(b.ship_code) + ' 기존 계획 확인됨' : '신규 검토 대상') + '</div>' +
            (CAN_ISSUE_WO
              ? '<a href="/service/agent/analyze?mode=NEW&branch_code=' + encodeURIComponent(res.branch.branch_code) + '&block_code=' + encodeURIComponent(b.block_id) + '" class="btn btn-primary btn-sm px-3" style="background:#0052cc;border-color:#0052cc;">+ 새 작업지시 준비하기</a>'
              : '<div class="small text-muted">작업지시 생성은 담당자 권한이 필요합니다.</div>');
        }

        setStageHtml(
          '<div class="row g-3">' +
            '<div class="col-lg-7">' +
              '<div class="panel-card h-100 mb-0">' +
                '<div class="section-bar">' +
                  '<select id="vision-block-select" class="form-select form-select-sm w-auto fw-semibold">' + opts + '</select>' +
                  '<a href="/vision/?branch=' + encodeURIComponent(res.branch.branch_code) + '" class="btn btn-outline-primary btn-sm">실시간 현장 관제 →</a>' +
                '</div>' +
                '<div class="bg-dark text-white rounded p-3 text-center mb-3">' +
                  (v && v.image_uri ? '<img src="' + esc(v.image_uri) + '" class="img-fluid rounded" style="max-height:280px;">' : '<div class="py-5 text-secondary small">저장된 현장 사진이 없습니다. 실시간 현장 관제에서 카메라를 확인해 주세요.</div>') +
                '</div>' +
                '<div class="row g-2 small">' +
                  '<div class="col-4"><div class="border rounded p-2 bg-light"><div class="text-muted">위치 야드</div><strong>' + esc(res.branch.branch_name) + '</strong></div></div>' +
                  '<div class="col-4"><div class="border rounded p-2 bg-light"><div class="text-muted">인식된 블록 번호</div><strong class="text-primary">' + (v && v.ocr_text ? esc(v.ocr_text) : '미감지') + '</strong></div></div>' +
                  '<div class="col-4"><div class="border rounded p-2 bg-light"><div class="text-muted">탐지 객체</div><strong>' + (v && v.detected_objects && v.detected_objects.length ? esc(v.detected_objects.join(', ')) : '없음') + '</strong></div></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="col-lg-5">' +
              '<div class="panel-card h-100 mb-0">' +
                '<div class="section-bar"><h3 class="panel-title">오늘 작업지시 중복 확인</h3></div>' +
                '<div class="row g-2 mb-3 small">' +
                  '<div class="col-6"><div class="border rounded p-2"><span class="text-muted d-block">선박 / 블록</span><strong>' + esc(b.ship_code) + ' · ' + esc(b.block_id) + '</strong></div></div>' +
                  '<div class="col-6"><div class="border rounded p-2"><span class="text-muted d-block">강종 / 두께 / 공정</span><strong>' + esc(b.steel_type) + ' · ' + esc(b.thickness_mm) + ' · ' + esc(b.process) + '</strong></div></div>' +
                '</div>' +
                dupHtml +
              '</div>' +
            '</div>' +
          '</div>'
        );

        $('#vision-block-select').on('change', function () {
          var opt = this.options[this.selectedIndex];
          renderVisionCheckView(opt.getAttribute('data-branch') || '', $(this).val());
        });
      }
    });
  }

  /* =========================================================================
     자연어 요청 전송 (Enter 전송 · Shift+Enter 줄바꿈 · 즉시 비움 + 탭 옆 배지 표시)
     ========================================================================= */
  function openWsPdfModal(docId, title) {
    var url = '/api/document/file/' + docId;
    $('#ws-pdf-title').text(title || '문서 보기');
    $('#ws-pdf-newtab').attr('href', url);
    $('#ws-pdf-body').html('<iframe src="' + url + '" style="width:100%;height:72vh;border:0;"></iframe>');
    new bootstrap.Modal(document.getElementById('wsPdfModal')).show();
  }

  /* 요청에 맞춘 단독 메일/발주 미리보기 + 발송 버튼 화면 */
  function renderFocusedMailDraft(draft) {
    setActiveChip('draft');
    resetDynamicActions();
    var sendAct = registerAction(function () {
      $.ajax({
        url: '/service/api/workspace/send-draft',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          draft_type: $('#focus-draft-type').val(),
          recipient: $('#focus-draft-recipient').val(),
          subject: $('#focus-draft-subject').val(),
          body: $('#focus-draft-body').val()
        }),
        success: function (r) { alert(r.message); renderInitView(); },
        error: function (xhr) { alert((xhr.responseJSON && xhr.responseJSON.message) || '발송 처리에 실패했습니다.'); }
      });
    });
    var cancelAct = registerAction(function () { renderInitView(); });

    setStageHtml(
      '<div class="panel-card">' +
        '<div class="section-bar">' +
          '<h2 class="panel-title">' + (draft.type === 'PO' ? '발주 메일 미리보기 (수정 후 발송)' : '안내 메일 미리보기 (수정 후 발송)') + '</h2>' +
          '<select id="focus-draft-type" class="form-select form-select-sm w-auto">' +
            '<option value="EMAIL"' + (draft.type !== 'PO' ? ' selected' : '') + '>업무 · 자격 안내 메일</option>' +
            '<option value="PO"' + (draft.type === 'PO' ? ' selected' : '') + '>협력사 자재 발주 메일</option>' +
          '</select>' +
        '</div>' +
        '<div class="mb-2"><label class="form-label small fw-semibold mb-1">수신자</label><input id="focus-draft-recipient" class="form-control form-control-sm" value="' + esc(draft.recipient || '') + '"></div>' +
        '<div class="mb-2"><label class="form-label small fw-semibold mb-1">제목</label><input id="focus-draft-subject" class="form-control form-control-sm" value="' + esc(draft.subject || '') + '"></div>' +
        '<div class="mb-3"><label class="form-label small fw-semibold mb-1">본문 (직접 수정 가능)</label><textarea id="focus-draft-body" rows="8" class="form-control form-control-sm">' + esc(draft.body || '') + '</textarea></div>' +
        '<div class="d-flex justify-content-end gap-2">' +
          '<button type="button" class="btn btn-outline-secondary btn-sm px-3" data-act-id="' + cancelAct + '">취소</button>' +
          '<button type="button" class="btn btn-primary btn-sm px-4 fw-semibold" style="background:#0052cc;border-color:#0052cc;" data-act-id="' + sendAct + '">보내기</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* 오늘 업무 조회 결과 (없으면 새 작업지시 생성 안내) */
  function renderTodayWorkView(res) {
    setActiveChip('init');
    resetDynamicActions();
    var orders = res.orders || [];
    var bodyHtml = '';
    if (orders.length) {
      bodyHtml = orders.map(function (o) {
        return (
          '<div class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center flex-wrap gap-2">' +
            '<div>' +
              '<strong>' + esc(o.work_no) + '</strong> · ' + esc(o.ship_code) + ' / ' + esc(o.block_code) +
              '<div class="small text-muted">' + esc(o.branch_name) + ' · ' + esc(o.material_grade) + ' ' + esc(o.thickness_mm) + 'mm · ' + esc(o.process_code) + '</div>' +
            '</div>' +
            '<div class="d-flex align-items-center gap-2">' +
              '<span class="status-chip ' + (o.status_code === 'IN_PROGRESS' ? 'status-info' : 'status-warn') + '">' + esc(koStatus(o.status_code)) + '</span>' +
              '<a href="/service/work-status?work_id=' + esc(o.work_id) + '" class="btn btn-outline-primary btn-sm py-0">상세 보기</a>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    } else {
      bodyHtml =
        '<div class="text-center py-4">' +
          '<p class="text-secondary mb-3">' + esc(res.branch_name) + '에 현재 등록된 오늘 업무가 없습니다. 새 작업지시를 준비하시겠습니까?</p>' +
          (CAN_ISSUE_WO
            ? '<a href="/service/agent/analyze?mode=NEW&branch_code=' + encodeURIComponent(res.branch_code || '') + '" class="btn btn-primary btn-sm px-4" style="background:#0052cc;border-color:#0052cc;">+ 오늘 작업지시 생성하기</a>'
            : '<span class="small text-muted">작업지시 생성은 담당자 권한이 필요합니다.</span>') +
        '</div>';
    }

    setStageHtml(
      '<div class="panel-card">' +
        '<div class="section-bar">' +
          '<h2 class="panel-title">오늘 업무 현황 (' + esc(res.branch_name) + ' · ' + orders.length + '건)</h2>' +
          '<a href="/service/work-status" class="small fw-semibold text-decoration-none">작업 현황 전체 보기 →</a>' +
        '</div>' +
        bodyHtml +
      '</div>'
    );
  }

  function submitWorkspaceQuery(qText) {
    var q = $.trim(qText);
    if (!q) return;

    var $ta = $('#ws-input');
    $ta.val('');
    autoResizeTextarea($ta[0]);
    showActiveCmd(q);

    // 1단계: 스마트 명령 라우터로 야드 ERP / 메일 초안 / 오늘 업무 즉시 처리
    $.ajax({
      url: '/service/api/workspace/route-command',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ question: q }),
      success: function (routeRes) {
        if (routeRes.action === 'SHOW_VISION') {
          renderVisionCheckView(routeRes.branch_code || '', routeRes.block_code || '');
          return;
        }
        if (routeRes.action === 'SHOW_ERP') {
          renderErpView(routeRes.branch_code || 'ALL', routeRes.subtab || 'materials');
          return;
        }
        if (routeRes.action === 'SHOW_DRAFT' && routeRes.draft) {
          renderFocusedMailDraft(routeRes.draft);
          return;
        }
        if (routeRes.action === 'SHOW_TODAY_WORK') {
          renderTodayWorkView(routeRes);
          return;
        }

        // 2단계: 전문 질의 / 규격 검색 / 작업지시서 생성 -> 기존 LangGraph Agent 호출
        setActiveChip('qa');
        setStageHtml(
          '<div class="panel-card py-4">' +
            '<div class="d-flex align-items-center gap-3">' +
              '<div class="spinner-border spinner-border-sm text-primary" role="status"></div>' +
              '<div>' +
                '<div class="fw-bold">요청 내용을 분석하고 있습니다...</div>' +
                '<div id="ws-live-step" class="small text-muted">관련 기준서와 야드 자재·인력 정보를 확인 중입니다.</div>' +
              '</div>' +
            '</div>' +
          '</div>'
        );

        $.ajax({
          url: '/service/api/assistant/ask',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            question: q,
            page_context: { page_title: '통합 업무', summary: buildContextSummary() }
          }),
          success: function (res) {
            clearInterval(wsPollTimer);
            wsPollTimer = setInterval(function () {
              $.getJSON('/service/api/assistant/status/' + encodeURIComponent(res.session_id), function (st) {
                if (st.status === 'RUNNING') {
                  $('#ws-live-step').text(st.step_message || '분석 중입니다...');
                  return;
                }
                clearInterval(wsPollTimer);
                renderQaTabView(st);
              });
            }, 1500);
          },
          error: function (xhr) {
            setStageHtml('<div class="alert alert-danger">' + esc((xhr.responseJSON && xhr.responseJSON.message) || '요청 처리 중 오류가 발생했습니다.') + '</div>');
          }
        });
      },
      error: function (xhr) {
        setStageHtml('<div class="alert alert-warning">' + esc((xhr.responseJSON && xhr.responseJSON.message) || '요청 처리 권한이 없거나 오류가 발생했습니다.') + '</div>');
      }
    });
  }

  $('#ws-input').on('input', function () { autoResizeTextarea(this); });
  $('#ws-input').on('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitWorkspaceQuery($(this).val());
    }
  });
  $('#workspace-query-form').on('submit', function (e) {
    e.preventDefault();
    submitWorkspaceQuery($('#ws-input').val());
  });
  $('#btn-clear-cmd').on('click', clearActiveCmd);

  $('#btn-ws-sync').on('click', function () {
    if (currentMode === 'init') renderInitView();
    else if (currentMode === 'qa') renderQaTabView();
    else if (currentMode === 'erp') renderErpView(currentErpBranch, currentErpSubtab);
    else if (currentMode === 'draft') renderDraftCenterView();
    else if (currentMode === 'vision') renderVisionCheckView();
  });

  $('#ws-mode-chips').on('click', 'button', function () {
    var mode = $(this).data('mode');
    if (mode === 'init') renderInitView();
    else if (mode === 'qa') renderQaTabView();
    else if (mode === 'erp') renderErpView(currentErpBranch, currentErpSubtab);
    else if (mode === 'draft') renderDraftCenterView();
    else if (mode === 'vision') renderVisionCheckView();
  });

  if ($.trim($('#ws-input').val())) {
    submitWorkspaceQuery($('#ws-input').val());
  } else {
    renderInitView();
  }
})();
</script>
{% endblock %}
