{% extends "layout/base.html" %}
{% block title %}{{ 'FAQ 등록' if mode == 'faq' else 'QNA 작성' }} | K-SmartShip{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="panel-card">
      <h2 class="panel-title mb-3">{{ 'FAQ 등록' if mode == 'faq' else '문의글 작성' }}</h2>
      <form method="post" action="/service/faq/write">
        <input type="hidden" name="mode" value="{{ mode }}">
        {% if mode != 'faq' %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">문의 분류</label>
          <select name="category" class="form-select">
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">제목</label>
          <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">내용</label>
          <textarea name="content" rows="8" class="form-control" required></textarea>
        </div>
        <div class="d-flex justify-content-end gap-2">
          <a href="/service/faq?tab={{ mode }}" class="btn btn-outline-secondary">취소</a>
          <button type="submit" class="btn btn-primary px-4" style="background:#0052cc;border-color:#0052cc;">등록</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
