{% extends "layout/base.html" %}
{% block title %}계정 발급 신청 | K-SmartShip{% endblock %}
{% block page_context %}{"page_title": "계정 발급 신청", "summary": "사내·협력사 신규 사용자 계정 신청"}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="panel-card">
      <h3 class="fw-bold mb-1" style="color:#0b1f3a;">계정 발급 신청</h3>
      <p class="text-muted small mb-4">신청 완료 후 관리자 승인이 끝나면 로그인할 수 있습니다.</p>

      <form method="post" action="/register">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">아이디 *</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">비밀번호 *</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">성명 *</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">표시 이름 (닉네임)</label>
            <input type="text" name="display_name" class="form-control" placeholder="미입력 시 성명 사용">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">이메일</label>
            <input type="email" name="email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">소속 구분</label>
            <select name="user_type" class="form-select">
              <option value="INTERNAL">사내 직원 (INTERNAL)</option>
              <option value="EXTERNAL">외부 협력사 (EXTERNAL)</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">소속 회사</label>
            <select name="erp_company_code" class="form-select">
              {% for c in companies %}
              <option value="{{ c.company_code }}">{{ c.company_name }} ({{ c.company_code }})</option>
              {% else %}
              <option value="">선택 가능한 회사 없음</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">소속 야드</label>
            <select name="erp_branch_code" class="form-select">
              {% for b in branches %}
              <option value="{{ b.branch_code }}">{{ b.branch_name }}</option>
              {% else %}
              <option value="">선택 가능한 야드 없음</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">ERP 사번</label>
            <input type="text" name="erp_employee_code" class="form-control" placeholder="발급받은 사번 입력">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">부서 / 팀명</label>
            <input type="text" name="department_name" class="form-control" placeholder="소속 부서 또는 팀명 입력">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">주 작업구역</label>
            <input type="text" name="default_workspace" class="form-control" placeholder="담당 베이 또는 도크 구역 입력">
          </div>
        </div>
        <div class="mt-4 d-flex justify-content-end gap-2">
          <a href="/login" class="btn btn-outline-secondary">취소</a>
          <button type="submit" class="btn btn-primary px-4">계정 신청 제출</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
