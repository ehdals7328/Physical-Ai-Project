{% extends "layout/base.html" %}
{% block title %}계정 발급 신청 | K-SmartShip{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="panel-card">
      <h3 class="fw-bold mb-1" style="color:#0b1f3a;font-size:21px;">신규 계정 발급 신청</h3>
      <p class="text-muted small mb-4">신청 완료 후 관리자가 승인하면 로그인하여 이용할 수 있습니다.</p>

      <form method="post" action="/register">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">아이디 *</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">비밀번호 *</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">성명 *</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">표시 이름 (닉네임)</label>
            <input type="text" name="display_name" class="form-control" placeholder="미입력 시 성명 사용">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">이메일</label>
            <input type="email" name="email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">소속 구분</label>
            <select name="user_type" class="form-select">
              <option value="INTERNAL">사내 임직원</option>
              <option value="EXTERNAL">협력사</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">소속 회사</label>
            <select name="erp_company_code" class="form-select">
              <option value="">선택</option>
              {% for c in companies %}
              <option value="{{ c.company_code }}">{{ c.company_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">소속 야드</label>
            <select name="erp_branch_code" class="form-select">
              <option value="">선택</option>
              {% for b in branches %}
              <option value="{{ b.branch_code }}">{{ b.branch_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">사번</label>
            <input type="text" name="erp_employee_code" class="form-control" placeholder="발급받은 사번 입력">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">부서 / 팀명</label>
            <input type="text" name="department_name" class="form-control" placeholder="소속 부서 또는 팀명">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">주 작업 구역</label>
            <input type="text" name="default_workspace" class="form-control" placeholder="담당 작업 구역 입력 (미입력 시 야드 기본 구역)">
          </div>
        </div>
        <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
          <a href="/login" class="btn btn-outline-secondary">취소</a>
          <button type="submit" class="btn btn-primary px-4" style="background:#0052cc;border-color:#0052cc;">계정 신청 제출</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
