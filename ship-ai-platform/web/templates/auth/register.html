{% extends "layout/base.html" %}
{% block title %}계정 발급 신청 | K-SmartShip{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="surface-card">
      <h5 class="fw-bold mb-1">계정 발급 신청</h5>
      <p class="small text-muted mb-4">신청 내용은 관리자 마이페이지에 접수되며, 승인 후 로그인할 수 있습니다.</p>

      <form method="post" action="/register">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">아이디 *</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">비밀번호 *</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">성명 *</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">표시 이름(닉네임)</label>
            <input type="text" name="display_name" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">이메일</label>
            <input type="email" name="email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">소속 구분</label>
            <select name="user_type" class="form-select">
              <option value="INTERNAL">사내 임직원 (INTERNAL)</option>
              <option value="EXTERNAL">협력사 (EXTERNAL)</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label small fw-semibold">소속 회사</label>
            <select name="erp_company_code" class="form-select">
              <option value="">선택</option>
              {% for c in companies %}
              <option value="{{ c.company_code }}">{{ c.company_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">소속 야드</label>
            <select name="erp_branch_code" class="form-select">
              <option value="">선택</option>
              {% for b in branches %}
              <option value="{{ b.branch_code }}">{{ b.branch_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">ERP 사번</label>
            <input type="text" name="erp_employee_code" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-semibold">부서 / 팀명</label>
            <input type="text" name="department_name" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">주 작업 구역</label>
            <input type="text" name="default_workspace" class="form-control" placeholder="예: ZONE-A-BAY1">
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="/login" class="btn btn-outline-secondary">취소</a>
          <button type="submit" class="btn btn-primary px-4">계정 발급 신청</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
