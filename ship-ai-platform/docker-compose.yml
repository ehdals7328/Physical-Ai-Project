services:
  postgres-db:
    image: postgres:15-alpine
    container_name: ship-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB"]
    shm_size: '512m'
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres1234}
      POSTGRES_DB: ${POSTGRES_DB:-partner_b2b}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-partner_b2b}"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: ship-oracle
    restart: unless-stopped
    shm_size: '2g'
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 3G
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle1234}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10

  ship-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ship-ai-web
    restart: unless-stopped
    shm_size: '2g'
    deploy:
      resources:
        limits:
          memory: 7G
        reservations:
          memory: 4G
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      WEATHER_MCP_SERVER_URL: http://127.0.0.1:8000/mcp
      PARTNER_MCP_SERVER_URL: http://127.0.0.1:8001/mcp
    command: >
      sh -c "pip install -q psycopg2-binary &&
             mkdir -p /root/.gmail-mcp &&
             cp -f /app/gcp-oauth.keys.json /root/.gmail-mcp/gcp-oauth.keys.json 2>/dev/null || true;
             cp -f /app/.gmail-mcp-credentials.json /root/.gmail-mcp/credentials.json 2>/dev/null || true;
             python -u mcp_servers/weather_server.py &
             python -u mcp_servers/partner_mcp_server.py &
             sleep 2 &&
             python -u run.py"
    ports:
      - "5000:5000"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - .:/app
    depends_on:
      postgres-db:
        condition: service_healthy
      oracle-db:
        condition: service_started

volumes:
  postgres_data:
  oracle_data:
